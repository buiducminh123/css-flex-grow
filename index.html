<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-grow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Thuộc tính flex-grow</h1>

    <h2>Ví dụ 1: Div 2 có flex-grow: 4, các div khác flex-grow: 1</h2>
    <div class="main ex1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>

    <h2>Ví dụ 2: Chỉ div 2 có flex-grow: 1, các div khác giữ nguyên 80px</h2>
    <div class="main ex2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
</body>

</html>
